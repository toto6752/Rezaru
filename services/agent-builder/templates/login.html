{% extends "base.html" %}
{% block title %}Вход — Rezaru{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1 class="page-title">Войти в Rezaru</h1>
  <p class="page-subtitle">Конструктор ИИ-агентов для бизнеса</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login" class="form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@company.com">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>

  <p class="auth-switch">Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
</section>
{% endblock %}
