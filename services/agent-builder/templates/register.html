{% extends "base.html" %}
{% block title %}Регистрация — Rezaru{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1 class="page-title">Создать аккаунт</h1>
  <p class="page-subtitle">Начните собирать ИИ-агента для вашего бизнеса</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/register" class="form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@company.com">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
    </div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>

  <p class="auth-switch">Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
</section>
{% endblock %}
